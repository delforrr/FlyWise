name: Backend
on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - name: Verificar el límite de aplicación
        run: |
          salida=$(printf '%s\n' "import type { Injectable } from '@nestjs/common';" |
            ./node_modules/.bin/eslint --stdin --stdin-filename src/metrics/application/recalcular-pendientes.ts) && exit 1
          printf '%s\n' "$salida" | grep -F 'no-restricted-imports'
      - run: npm test -- --runInBand
